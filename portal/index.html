:root{

a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:#cfe3ff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;flex:none}

/* ---------- AI mark ---------- */
.aimark{font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.06em;line-height:.82;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;display:inline-block}
.lk-badge{background:var(--grad-v);color:#fff;padding:.02em .28em;border-radius:7px;font-weight:800;display:inline-block}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.5em;border:1px solid transparent;border-radius:var(--r-sm);
  padding:.62em 1.05em;font-weight:600;font-size:.92rem;background:#fff;color:var(--ink);transition:.16s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.sm{padding:.42em .75em;font-size:.85rem}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(17,99,235,.28)}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#cdd8ea;background:var(--soft)}
.btn.soft{background:var(--soft-2);color:var(--blue-deep);border-color:transparent}
.btn.soft:hover{background:#e4eeff}
.btn.block{width:100%;justify-content:center}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(1.06);transform:translateY(-1px)}
.del-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);flex:none;transition:.14s}
.del-btn:hover{color:var(--danger);border-color:#f0c7c9;background:var(--danger-bg)}
.del-btn svg{width:17px;height:17px}
.confirm-warn{display:flex;gap:14px;background:var(--danger-bg);border:1px solid #f3cdcf;border-radius:12px;padding:16px}
.confirm-warn svg{width:22px;height:22px;color:var(--danger);flex:none}
.confirm-warn b{color:var(--ink);font-size:.96rem}
.confirm-warn p{margin:6px 0 0;font-size:.86rem;color:var(--ink-2)}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.74rem;font-weight:600;padding:.26em .62em;border-radius:999px;background:var(--soft-2);color:var(--ink-2);white-space:nowrap}
.pill svg{width:13px;height:13px}
.st{display:inline-flex;align-items:center;gap:.4em;font-size:.74rem;font-weight:700;padding:.26em .62em;border-radius:999px}
.st::before{content:"";width:7px;height:7px;border-radius:50%}
.st.ok{background:var(--ok-bg);color:#0a7a43}.st.ok::before{background:var(--ok)}
.st.warn{background:var(--warn-bg);color:#9a6406}.st.warn::before{background:var(--warn)}
.st.info{background:var(--info-bg);color:#0a63b8}.st.info::before{background:var(--info)}
.st.muted{background:#eef1f6;color:#6b7486}.st.muted::before{background:#9aa4b4}
.st.violet{background:var(--violet-bg);color:#553bc7}.st.violet::before{background:var(--violet)}
.tag{font-size:.72rem;font-weight:600;color:var(--blue-deep);background:var(--soft-2);padding:.2em .55em;border-radius:6px;direction:ltr;unicode-bidi:isolate}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.app{display:none}
.app.show{display:block}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand .aimark{font-size:30px}
.brand .wm{display:flex;flex-direction:column;line-height:1.05}
.brand .wm .s{font-family:'Sora';font-weight:800;font-size:.96rem;color:var(--ink);letter-spacing:-.01em}
html[lang="ar"] .brand .wm .s{font-family:'Alexandria'}
.brand .wm .sub{font-size:.6rem;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
html[lang="ar"] .brand .wm .sub{letter-spacing:normal;text-transform:none;font-size:.66rem}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:9px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.15s}
.iconbtn:hover{background:var(--soft);border-color:#d6e0ee}
.hsearch{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.44em .72em;color:var(--muted);cursor:pointer;min-width:190px;transition:.15s}
.hsearch:hover{border-color:#d6e0ee;background:var(--soft)}
.hsearch .ico{flex:none;color:var(--muted)}
.hsearch input{border:0;background:none;outline:0;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer;width:100%;padding:0}
.iconbtn.onlyMobile{display:none}
@media(max-width:760px){.iconbtn.onlyMobile{display:grid}}
.iconbtn svg{width:18px;height:18px}
.langtog{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.46em .7em;font-weight:700;font-size:.85rem;color:var(--ink)}
.langtog:hover{background:var(--soft)}
.langtog svg{width:16px;height:16px;color:var(--blue)}
.adminsw{display:inline-flex;align-items:center;gap:.55em;font-size:.8rem;font-weight:600;color:var(--muted);user-select:none}
.adminsw .track{width:38px;height:21px;border-radius:999px;background:#d7deea;position:relative;transition:.18s}
.adminsw .knob{position:absolute;top:2px;inset-inline-start:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.adminsw.on .track{background:var(--grad)}
.adminsw.on .knob{inset-inline-start:19px}
.adminsw.on{color:var(--blue-deep)}
.chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:.32em .55em .32em .4em;background:#fff;position:relative}
.chip:hover{background:var(--soft)}
.chip .av{width:30px;height:30px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.78rem;font-family:'Sora'}
.chip .who{display:flex;flex-direction:column;line-height:1.1;max-width:140px}
.chip .who b{font-size:.78rem;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .who span{font-size:.66rem;color:var(--muted)}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);padding:6px;min-width:190px;display:none;z-index:60}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;padding:.6em .7em;border-radius:8px;font-size:.86rem;color:var(--ink-2);font-weight:500}
.menu button:hover{background:var(--soft)}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 2px}

/* nav */
nav.tabs{border-bottom:1px solid var(--line);background:#fff}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:.5em;padding:14px 14px;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap;border:0;background:none}
.tab svg{width:18px;height:18px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--blue-deep)}
.tab.active::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
.tab .dot{background:var(--danger);color:#fff;font-size:.62rem;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center;padding:0 4px}

main{min-height:60vh;padding-bottom:64px}
.section{padding:44px 0}
section[id],[id^='fw-']{scroll-margin-top:128px}
html{scroll-behavior:smooth}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
html[lang="ar"] .eyebrow{letter-spacing:normal}
.h-lead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.h-lead p{margin-top:8px}
.h-lead h2{font-size:1.6rem;font-weight:700}
.h-lead p{margin:.35em 0 0;color:var(--muted);max-width:62ch}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--grad-soft);border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(17,99,235,.10) 1px,transparent 0);background-size:26px 26px;opacity:.55;mask-image:linear-gradient(180deg,#000,transparent 92%)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0}
.hero .b1{width:380px;height:380px;background:#bcd6ff;top:-120px;inset-inline-end:-80px}
.hero .b2{width:300px;height:300px;background:#c4f0ff;bottom:-140px;inset-inline-start:18%}
.hero-inner{position:relative;z-index:2;padding:58px 0 46px}
.hero h1{font-size:2.85rem;font-weight:800;max-width:17ch;letter-spacing:-.02em}
.hero h1 .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero p.sub{font-size:1.12rem;color:var(--ink-2);max-width:60ch;margin:18px 0 26px}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 7px 7px 16px;box-shadow:var(--sh);max-width:560px}
.searchbar svg{width:20px;height:20px;color:var(--muted)}
.searchbar input{flex:1;border:0;outline:0;font-size:1rem;font-family:inherit;background:none;color:var(--ink);min-width:0}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:34px}
.stat .n{font-family:'Sora';font-weight:800;font-size:1.7rem;color:var(--ink);line-height:1}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:5px}

/* cards / grids */
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.16s}
.card.hover:hover{box-shadow:var(--sh);border-color:#d8e2f1;transform:translateY(-2px)}
.qlink{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.qlink .ic{width:42px;height:42px;border-radius:11px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center}
.qlink .ic svg{width:21px;height:21px}
.qlink h3{font-size:1.04rem;font-weight:700}
.qlink p{margin:0;font-size:.86rem;color:var(--muted)}
.qlink .go{font-size:.82rem;font-weight:700;color:var(--blue);display:inline-flex;align-items:center;gap:.4em;margin-top:auto}
.qlink .go svg{width:15px;height:15px;transition:.15s}
.qlink:hover .go svg{transform:translateX(3px)}
html[dir="rtl"] .qlink:hover .go svg{transform:translateX(-3px)}

/* list rows */
.rowcard{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;transition:.15s;cursor:pointer}
.rowcard:hover{border-color:#d2deef;background:var(--soft);box-shadow:var(--sh-sm)}
.rowcard .lead{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--soft-2);color:var(--blue-deep)}
.rowcard .lead svg{width:20px;height:20px}
.rowcard .mid{flex:1;min-width:0}
.rowcard .mid .ttl{font-weight:700;color:var(--ink);font-size:.96rem}
.rowcard .mid .meta{font-size:.78rem;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rowcard .end{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* accordion */
.acc{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px;overflow:hidden;transition:.15s}
.acc:hover{border-color:#d8e2f1}
.acc.open{box-shadow:var(--sh-sm);border-color:#cfdcf0}
.acc-h{display:flex;align-items:center;gap:14px;padding:17px 18px;width:100%;background:none;border:0;text-align:start}
.acc-rank{font-family:'Sora';font-weight:800;font-size:.95rem;color:#fff;background:var(--grad);min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.acc-q{flex:1;font-weight:650;font-weight:600;color:var(--ink);font-size:1rem}
.acc-meta{display:flex;align-items:center;gap:10px;flex-shrink:0}
.acc .chev{width:20px;height:20px;color:var(--muted);transition:.22s;flex-shrink:0}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:0 18px 18px;color:var(--ink-2)}
.acc.open .acc-body{display:block;animation:fade .25s ease}
.acc-body .ans{padding-top:4px;border-top:1px solid var(--line-2);margin-top:2px}
.acc-body .ans p{margin:14px 0 0}
.acc-foot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.acc-foot .ref{display:inline-flex;align-items:center;gap:.5em;font-size:.82rem;font-weight:600;color:var(--blue-deep);background:var(--soft-2);padding:.45em .7em;border-radius:8px}
.acc-foot .ref svg{width:15px;height:15px}
.helpful{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.helpful button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.35em .6em;font-size:.8rem;display:inline-flex;align-items:center;gap:.4em;color:var(--ink-2)}
.helpful button:hover{background:var(--soft);border-color:#cfdcf0}
.helpful button svg{width:14px;height:14px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.45em .9em;font-size:.84rem;font-weight:600;color:var(--ink-2);transition:.14s}
.fchip:hover{background:var(--soft)}
.fchip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(17,99,235,.22)}

/* categories */
.catcard{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.catcard .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--grad)}
.catcard .ic svg{width:22px;height:22px}
.catcard h3{font-size:1.02rem;font-weight:700}
.catcard p{margin:.25em 0 0;font-size:.85rem;color:var(--muted)}
.catcard .cnt{font-size:.76rem;color:var(--blue);font-weight:700;margin-top:8px}

/* vendors */
.vcard{display:flex;flex-direction:column;gap:14px;height:100%}
.vhead{display:flex;align-items:center;gap:12px}
.vlogo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:1rem;color:#fff;flex-shrink:0}
.vcard h3{font-size:1.05rem;font-weight:700}
.vcard .vmeta{font-size:.76rem;color:var(--muted)}
.vrow{display:flex;gap:8px;font-size:.84rem;color:var(--ink-2);align-items:flex-start}
.vrow svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;margin-top:2px}
.vrow b{color:var(--ink);font-weight:600}
.vdiv{border-top:1px solid var(--line-2);margin:2px 0}

/* table-ish decrees handled by rowcards */

/* requests */
.req-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel h3{font-size:1.12rem;font-weight:700;margin-bottom:4px}
.panel .desc{font-size:.86rem;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:.72em .85em;font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;transition:.14s}
.field textarea{resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,128,242,.13)}
.dropzone{border:1.5px dashed #c7d4e8;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:.85rem;background:var(--soft)}
.dropzone svg{width:22px;height:22px;color:var(--blue);margin-bottom:4px}
.ticket{border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;background:#fff}
.ticket .tt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ticket .tt b{font-size:.94rem;color:var(--ink);font-weight:650;font-weight:600}
.ticket .tid{font-size:.74rem;color:var(--muted);font-family:'Sora';font-weight:600;direction:ltr;unicode-bidi:isolate}
.ticket .resp{margin-top:12px;padding:12px 14px;background:var(--soft-2);border-radius:10px;font-size:.86rem;color:var(--ink-2);border-inline-start:3px solid var(--blue)}
.ticket .resp .rl{font-size:.72rem;font-weight:700;color:var(--blue-deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
html[lang="ar"] .ticket .resp .rl{letter-spacing:0}

/* admin banner */
.adminbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0b1530,#15224a);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:22px}
.adminbar .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.adminbar .ic svg{width:18px;height:18px;color:#7fd3ff}
.adminbar b{color:#fff;font-size:.95rem}
.adminbar p{margin:2px 0 0;font-size:.8rem;color:#aebbd6}
.adminbar .btn{margin-inline-start:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,40,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:48px 18px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:600px;animation:pop .22s ease}
.modal.wide{max-width:680px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.modal-h h3{font-size:1.25rem;font-weight:700}
.modal-h .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.modal-h .x:hover{background:var(--soft)}
.modal-b{padding:18px 24px 24px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.kv{display:flex;gap:10px;font-size:.88rem;padding:9px 0;border-bottom:1px solid var(--line-2)}
.kv .k{color:var(--muted);min-width:130px}
.kv .v{color:var(--ink);font-weight:600}
.timeline{margin-top:6px}
.tline{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tline:not(:last-child)::before{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tline .pt{width:16px;height:16px;border-radius:50%;border:3px solid var(--cyan);background:#fff;flex-shrink:0;margin-top:2px;z-index:1}
.tline .tx b{font-size:.86rem;color:var(--ink)}
.tline .tx span{font-size:.78rem;color:var(--muted);display:block}

/* toast */
.toast{position:fixed;inset-block-end:24px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:#0b1530;color:#fff;padding:.85em 1.2em;border-radius:12px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:.6em;font-size:.9rem;font-weight:500;z-index:120;opacity:0;transform:translateY(14px);transition:.28s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast svg{width:18px;height:18px;color:#5fe6a6}

/* footer */
footer.foot{background:#0a1022;color:#aeb8cf;padding:46px 0 30px}
footer.foot .fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:30px}
footer.foot h4{color:#fff;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;font-weight:700}
html[lang="ar"] footer.foot h4{letter-spacing:0}
footer.foot a{display:block;font-size:.88rem;padding:5px 0;color:#9aa6c0}
footer.foot a:hover{color:#fff}
.foot-lk .aimark{font-size:34px}
.foot-lk .en{font-size:.66rem;letter-spacing:.16em;color:#7c89a6;font-weight:700;margin-top:8px}
html[lang="ar"] .foot-lk .en{letter-spacing:.02em}

/* ===== HOME / STRATEGY ===== */
.shero{position:relative;overflow:hidden;background:linear-gradient(180deg,#f3f8ff, #ffffff 70%);border-bottom:1px solid var(--line);padding:52px 0 46px}
.shero-in{position:relative;z-index:2;text-align:center;max-width:900px}
.shero h1{font-size:clamp(2rem,4.4vw,3.2rem);letter-spacing:-.02em;margin-top:12px}
.shero .sub{color:var(--ink-2);font-size:1.06rem;max-width:720px;margin:16px auto 0}
.shero-tag{display:inline-flex;gap:12px;align-items:center;margin-top:22px;font-family:'Sora';font-weight:800;font-size:1.05rem;color:var(--blue-deep)}
.shero-tag i{color:var(--muted-2);font-style:normal}
.shero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.shero-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.shero-stats>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 22px;min-width:120px;box-shadow:var(--sh-sm)}
.shero-stats b{display:block;font-family:'Sora';font-weight:800;font-size:1.9rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.shero-stats span{font-size:.78rem;color:var(--muted);font-weight:600}
/* journey */
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:10px;position:relative}
.jitem{position:relative;padding:26px 10px 0;text-align:center}
.jline{position:absolute;top:33px;left:0;right:0;height:2px;background:var(--line)}
.jitem:first-child .jline{left:50%}.jitem:last-child .jline{right:50%}
.jdot{position:relative;z-index:2;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--muted-2);margin:0 auto;transition:.2s}
.jitem.now .jdot{border-color:transparent;background:var(--grad);box-shadow:0 0 0 5px rgba(17,99,235,.15)}
.jitem:hover .jdot{border-color:var(--blue)}
.jyear{font-family:'Sora';font-weight:800;font-size:1.05rem;color:var(--ink);margin-top:12px}
.jitem.now .jyear{color:var(--blue-deep)}
.jt{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.4}
/* announce */
.announce{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(120deg,#0a1022,#132a63);color:#eaf1ff;border-radius:var(--r-lg);padding:26px 28px}
.announce .ico{flex:none;width:26px;height:26px;color:#7fc4ff}
.announce p{margin:0;font-size:1rem;line-height:1.7;color:#dfe8fb}
/* vision / mission */
.vm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.vm{border-radius:var(--r-lg);padding:28px;border:1px solid var(--line)}
.vm-k{display:inline-flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep)}
.vm-k .ico{width:18px;height:18px}
.v-vision{background:linear-gradient(160deg,#eef4ff,#fff)}
.v-vision h3{font-size:1.3rem;margin:14px 0 8px;line-height:1.4}
.v-vision p{margin:0;color:var(--ink-2)}
.v-mission{background:var(--soft)}
.v-mission .big{font-size:1.05rem;line-height:1.7;color:var(--ink);margin:14px 0 0;font-weight:500}
/* objectives */
.obj{position:relative;overflow:hidden}
.obj .ic{width:46px;height:46px;border-radius:12px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center;margin-bottom:14px}
.obj .ic .ico{width:24px;height:24px}
.obj-n{position:absolute;top:16px;inset-inline-end:20px;font-family:'Sora';font-weight:800;font-size:1.4rem;color:var(--line)}
.obj h3{font-size:1.06rem;margin-bottom:8px}
.obj p{font-size:.9rem;color:var(--ink-2);margin:0}
/* targets */
.tgt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tgt{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;text-align:center;box-shadow:var(--sh-sm)}
.tgt .num{font-family:'Sora';font-weight:800;font-size:2.8rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-flex;align-items:baseline}
.tgt .num em{font-style:normal;font-size:1.4rem;-webkit-text-fill-color:var(--muted-2);margin-inline-end:2px}
.tgt p{font-size:.86rem;color:var(--ink-2);margin:12px 0 0;line-height:1.5}
/* tracks */
.trk-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.trk-tab{display:flex;gap:10px;align-items:center;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.16s}
.trk-tab:hover{border-color:#cdd8ea;background:var(--soft)}
.trk-tab.active{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(17,99,235,.28)}
.trk-i{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center}
.trk-tab.active .trk-i{background:rgba(255,255,255,.2);color:#fff}
.trk-i .ico{width:19px;height:19px}
.trk-x{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.trk-x b{font-family:'Sora';font-size:.72rem;letter-spacing:.04em;opacity:.8}
.trk-x span{font-size:.82rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.trk-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--sh-sm)}
.trk-head{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.trk-head .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
.trk-head .ic .ico{width:26px;height:26px}
.trk-head h3{font-size:1.2rem}
.trk-head p{margin:4px 0 0;color:var(--ink-2);font-size:.92rem}
.trk-cols{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.trk-lbl{font-family:'Sora';font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.trk-obj{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:.92rem;color:var(--ink-2)}
.trk-obj .ico{flex:none;width:18px;height:18px;color:var(--ok);margin-top:2px}
.trk-scope{display:flex;flex-wrap:wrap;gap:8px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--soft-2);color:var(--ink-2);border-radius:999px;padding:.4em .8em;font-size:.82rem;font-weight:600}
.chipx b{color:var(--blue-deep)}
/* benefits */
.ben-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ben{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;transition:.16s}
.ben:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:#cdd8ea}
.ben .ico{width:26px;height:26px;color:var(--blue-deep);margin-bottom:10px}
.ben span{display:block;font-size:.88rem;font-weight:600;color:var(--ink)}
/* principles */
.prin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.prin{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 16px;cursor:pointer;transition:.16s}
.prin:hover{border-color:#cdd8ea}
.prin.open{background:var(--soft)}
.prin-h{display:flex;align-items:center;gap:12px;padding:14px 0}
.prin-n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:.85rem}
.prin.open .prin-n{background:var(--grad);color:#fff}
.prin-t{flex:1;font-weight:700;font-size:.94rem;color:var(--ink)}
.prin-h .chev{transition:.2s;color:var(--muted-2)}
.prin.open .prin-h .chev{transform:rotate(180deg)}
.prin-d{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s ease,padding .35s ease;font-size:.88rem;color:var(--ink-2);line-height:1.65}
.prin.open .prin-d,.crit.open .prin-d{max-height:900px;opacity:1;padding:2px 0 18px}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.phase{position:relative;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:4px}
.phase:hover{border-color:#cdd8ea;background:var(--soft)}
.phase.active{border-color:transparent;background:linear-gradient(160deg,#0a1022,#183176);color:#fff;box-shadow:0 10px 24px rgba(10,16,34,.28)}
.ph-dot{width:12px;height:12px;border-radius:50%;background:var(--muted-2);margin-bottom:6px}
.phase.active .ph-dot{background:#7fc4ff}
.phase b{font-family:'Sora';font-size:.95rem}
.ph-t{font-size:.86rem;font-weight:600}
.phase:not(.active) .ph-t{color:var(--ink-2)}
.ph-dt{font-size:.76rem;opacity:.8;color:var(--muted)}
.phase.active .ph-dt{color:#cfe0ff}
.phase-detail{display:flex;gap:16px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px}
.phase-detail .ic{flex:none;width:44px;height:44px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center}
.phase-detail h3{font-size:1.05rem}
.ph-dt2{font-weight:600;font-size:.82rem;color:var(--blue-deep);margin-inline-start:6px}
.phase-detail p{margin:8px 0 0;color:var(--ink-2);font-size:.92rem;line-height:1.7}
@media(max-width:900px){
  .vm-grid{grid-template-columns:1fr}
  .tgt-grid{grid-template-columns:1fr 1fr}
  .trk-tabs{grid-template-columns:1fr 1fr}
  .trk-cols{grid-template-columns:1fr}
  .ben-grid{grid-template-columns:1fr 1fr}
  .road{grid-template-columns:1fr 1fr}
  .journey{grid-template-columns:repeat(3,1fr);row-gap:22px}
  .prin-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .tgt-grid,.trk-tabs,.ben-grid,.road,.journey{grid-template-columns:1fr}
}

/* ===== FRAMEWORK / GUIDES / FAQS ===== */
.fw-hero{background:linear-gradient(180deg,#f3f8ff,#fff 80%);border-bottom:1px solid var(--line);padding:46px 0 30px}
.fw-hero h1{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-top:12px;letter-spacing:-.015em;max-width:820px}
.fw-hero .sub{color:var(--ink-2);max-width:780px;margin-top:12px}
.fw-ver{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:.82rem;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.4em .9em}
.fw-ver .ico{width:15px;height:15px}
.fw-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.fw-navbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:.5em 1em;font-weight:600;font-size:.86rem;color:var(--ink-2);cursor:pointer;transition:.15s}
.fw-navbtn:hover{border-color:var(--blue);color:var(--blue-deep);background:var(--soft)}
.fw-navbtn .ico{width:16px;height:16px}
.scope-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.scope{border-radius:var(--r-lg);padding:24px;border:1px solid var(--line)}
.scope.in{background:linear-gradient(160deg,#f0faf4,#fff)}
.scope.out{background:linear-gradient(160deg,#fdf3f3,#fff)}
.scope-h{display:flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;margin-bottom:14px}
.scope.in .scope-h{color:#0a7a43}.scope.out .scope-h{color:#b3403f}
.scope-h .ico{width:20px;height:20px}
.scope p{margin:0;color:var(--ink-2);font-size:.92rem;line-height:1.7}
.fw-tgt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fw-tgt{display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh-sm)}
.fw-tgt .num{flex:none;font-family:'Sora';font-weight:800;font-size:2.6rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fw-tgt b{display:block;font-size:.96rem;color:var(--ink);line-height:1.5}
.fw-tgt p{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.fw-acc{margin-bottom:10px}
.fw-check{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:.92rem;color:var(--ink-2)}
.fw-check .ck{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:.76rem;margin-top:1px}
.crit-grid{display:grid;grid-template-columns:1fr;gap:10px}
.crit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 16px;cursor:pointer;transition:.16s}
.crit:hover{border-color:#cdd8ea}
.crit.open{background:var(--soft)}
.crit-h{display:flex;align-items:center;gap:12px;padding:14px 0}
.crit-i{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft-2);color:var(--blue-deep);display:grid;place-items:center}
.crit-i .ico{width:18px;height:18px}
.crit-h b{flex:1;font-size:.96rem;color:var(--ink)}
.crit-h .chev{transition:.2s;color:var(--muted-2)}
.crit.open .crit-h .chev{transform:rotate(180deg)}
.crit-ul{margin:0;padding:0 0 16px;list-style:none}
.crit-ul li{position:relative;padding-inline-start:20px;margin-bottom:8px;font-size:.9rem;color:var(--ink-2)}
.crit-ul li::before{content:'';position:absolute;inset-inline-start:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--grad)}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:14px}

.gcover span{font-size:.6rem;letter-spacing:.14em;color:#7fc4ff}
.ghead h3{font-size:1.05rem;line-height:1.35}
.gmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gdesc{margin:0;font-size:.9rem;color:var(--ink-2);line-height:1.65}
.gtoc{display:flex;flex-wrap:wrap;gap:8px}
.gfoot{display:flex;gap:10px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:900px){.scope-grid,.fw-tgt-grid,.guide-grid{grid-template-columns:1fr}}

.uspacer{flex:1}
.ufs{display:inline-flex;gap:2px}
.ufs button{background:none;border:1px solid rgba(255,255,255,.22);color:#cfd6e2;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:700;transition:.15s}
.ufs button:hover{background:rgba(255,255,255,.12);color:#fff}
.ulang{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:700;transition:.15s}
.ulang:hover{background:rgba(255,255,255,.12)}
.ulang .ico{width:14px;height:14px}
@media(max-width:760px){.uttl{display:none}}
/* header search — u.ae pill */
.hsearch{min-width:300px;border-radius:999px;padding:.3em .3em .3em 1em;gap:.6em}
html[dir="rtl"] .hsearch{padding:.3em 1em .3em .3em}
.hsearch input{font-size:.88rem}
.hs-btn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center}
.hs-btn .ico{width:16px;height:16px}
.hs-btn.big{width:44px;height:44px}
/* tabs — bolder u.ae nav */
.tabs{border-top:1px solid var(--line)}
.tab{font-weight:700}
/* breadcrumbs */
.crumbs{display:flex;align-items:center;gap:8px;padding:14px 0 0;font-size:.82rem;color:var(--muted)}
.crumbs a{color:var(--blue);font-weight:600;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--ink-2);font-weight:600}
.crumbs .sep{color:var(--muted-2)}
/* hero search-first */
.shero-search{max-width:640px;margin:28px auto 0}
.hero-sb{max-width:none;border-radius:999px;padding:.35em .35em .35em 1.1em;box-shadow:var(--sh-md)}
html[dir="rtl"] .hero-sb{padding:.35em 1.1em .35em .35em}
.hero-sb input{font-size:1rem}
.pop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:.82rem;color:var(--muted)}
.pop-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.35em .95em;font-size:.8rem;font-weight:600;color:var(--blue-deep);transition:.15s}
.pop-chip:hover{border-color:var(--blue);background:var(--soft)}
/* flatter cards (u.ae hairline style) */
.card{box-shadow:none}
.card.hover:hover{border-color:var(--blue);box-shadow:0 10px 26px rgba(1,72,194,.10)}
/* page feedback */
.pgfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px;padding:22px 0 40px}
.pf-q{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pf-q b{color:var(--ink);font-size:.95rem}
.pf-q span{display:inline-flex;gap:8px}
.pf-upd{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted)}
.pf-upd .ico{width:15px;height:15px}
/* scroll to top */
.totop{position:fixed;inset-inline-end:22px;bottom:22px;z-index:120;width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 10px 24px rgba(1,72,194,.35);opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop svg{width:20px;height:20px}
</style>

const MOST_ASKED = [
  { topic:'infra', asked:312, decree:'AI-2025-014',
    q:{en:'Will the government provide the servers and GPUs we need, or must each entity procure its own infrastructure?',
       ar:'هل ستوفّر الحكومة الخوادم ووحدات معالجة الرسوميات (GPU) التي نحتاجها، أم يجب على كل جهة شراء بنيتها التحتية الخاصة؟'},
    a:{en:'Compute is provided centrally by default. Entities access GPU capacity through the Government AI Cloud — a shared, sovereign environment hosted inside the UAE — rather than buying their own hardware. Standard workloads (inference, fine-tuning, and agentic pilots) run on allocated quotas you request through this portal. Entities should not procure dedicated GPU servers independently; entity-owned clusters are permitted only by exception for classified or latency-critical workloads, with prior approval from the Programme Office. Compute is funded from the central allocation, not your entity capex.',
       ar:'تُوفَّر القدرة الحوسبية مركزيًا بشكل افتراضي. تحصل الجهات على وحدات معالجة الرسوميات من خلال السحابة الحكومية للذكاء الاصطناعي — وهي بيئة سيادية مشتركة مستضافة داخل الدولة — بدلًا من شراء أجهزتها الخاصة. تعمل الأحمال القياسية (الاستدلال والضبط الدقيق والتجارب الوكيلة) ضمن حصص مخصّصة تُطلب عبر هذه البوابة. لا ينبغي للجهات شراء خوادم GPU مستقلة؛ ولا يُسمح بالمجموعات المملوكة للجهة إلا استثناءً للأحمال السرّية أو الحسّاسة للزمن، وبموافقة مسبقة من مكتب البرنامج. وتُموَّل الحوسبة من المخصّص المركزي وليس من ميزانية جهتكم الرأسمالية.'} },
  { topic:'vendors', asked:287, decree:'AI-2025-009',
    q:{en:'Can we work with any technology company (Microsoft, Google, AWS…), or are we restricted to specific approved vendors?',
       ar:'هل يمكننا العمل مع أي شركة تقنية (مايكروسوفت، جوجل، أمازون…)، أم أننا مقيّدون بموردين معتمدين محدّدين؟'},
    a:{en:'You select from the Approved Vendors & Platforms list. Microsoft Azure, Google Cloud, AWS, and Oracle are approved at the cloud-platform layer, and sovereign/local providers (Core42, e& enterprise, du) are approved for hosting and managed services. Approval is scoped: a vendor cleared for general workloads is not automatically cleared for sensitive or citizen data. You are free to choose among approved vendors on fit and value — there is no single mandated provider — but engaging a vendor outside the list, or using one outside its cleared scope, requires an exception request. Data classified Restricted or above must remain in sovereign, in-country environments.',
       ar:'تختارون من قائمة الموردين والمنصات المعتمدة. منصّات مايكروسوفت أزور وجوجل كلاود وأمازون AWS وأوراكل معتمدة على مستوى المنصّة السحابية، كما أنّ المزوّدين السياديين/المحليين (Core42، e& enterprise، du) معتمدون للاستضافة والخدمات المُدارة. والاعتماد محدّد النطاق: فالمورد المعتمد للأحمال العامة ليس معتمدًا تلقائيًا للبيانات الحسّاسة أو بيانات المتعاملين. لكم حرية الاختيار بين الموردين المعتمدين وفق الملاءمة والقيمة — فلا يوجد مزوّد وحيد إلزامي — أمّا التعاقد مع مورد خارج القائمة أو استخدامه خارج نطاقه المُصرّح به فيتطلّب طلب استثناء. ويجب أن تبقى البيانات المصنّفة «مقيّدة» فأعلى داخل بيئات سيادية داخل الدولة.'} },
  { topic:'continuity', asked:241, decree:'AI-2025-021',
    q:{en:'We already have AI projects under way. Do we have to discard them, or can we continue?',
       ar:'لدينا مشاريع ذكاء اصطناعي قائمة بالفعل. هل يجب التخلّي عنها أم يمكننا الاستمرار؟'},
    a:{en:'You do not discard work in progress. Existing projects continue under a transition pathway: register each active AI initiative through this portal within the onboarding window, and it is assessed against the new standards (data residency, approved vendors, security, model governance). Most projects continue with minor adjustments; only components that conflict with mandatory controls — for example sensitive data hosted outside sovereign environments — must be remediated on an agreed timeline. Projects already in production are prioritised for review so service continuity is preserved. No compliant project is cancelled because of the programme.',
       ar:'لا يتم التخلّي عن الأعمال الجارية. تستمرّ المشاريع القائمة ضمن مسار انتقالي: سجّلوا كل مبادرة ذكاء اصطناعي نشطة عبر هذه البوابة خلال فترة الانضمام، وسيتم تقييمها وفق المعايير الجديدة (إقامة البيانات، والموردون المعتمدون، والأمن، وحوكمة النماذج). وتستمرّ معظم المشاريع مع تعديلات طفيفة؛ ولا يلزم سوى معالجة المكوّنات التي تتعارض مع الضوابط الإلزامية — مثل استضافة بيانات حسّاسة خارج البيئات السيادية — وفق جدول زمني متّفق عليه. وتحظى المشاريع في مرحلة الإنتاج بأولوية المراجعة حفاظًا على استمرارية الخدمة. ولا يُلغى أي مشروع متوافق بسبب البرنامج.'} },
  { topic:'data', asked:198, decree:'AI-2025-003',
    q:{en:'Where must our data and AI models be hosted, and can we use public cloud regions?',
       ar:'أين يجب استضافة بياناتنا ونماذجنا، وهل يمكننا استخدام مناطق السحابة العامة؟'},
    a:{en:'Hosting follows data classification. Public and Internal data may run in approved public-cloud regions located inside the UAE. Restricted, Confidential, and Secret data must stay within sovereign, in-country environments (the Government AI Cloud or an approved sovereign provider) and may not be sent to public model endpoints abroad. Each system records its data classification at registration, which determines the eligible hosting options shown to you.',
       ar:'تتبع الاستضافة تصنيف البيانات. يجوز تشغيل البيانات «العامة» و«الداخلية» في مناطق سحابة عامة معتمدة داخل الدولة. أمّا البيانات «المقيّدة» و«السرّية» و«السرّية للغاية» فيجب أن تبقى داخل بيئات سيادية في الدولة (السحابة الحكومية للذكاء الاصطناعي أو مزوّد سيادي معتمد) ولا يجوز إرسالها إلى نقاط نهاية نماذج عامة في الخارج. ويسجّل كل نظام تصنيف بياناته عند التسجيل، وهو ما يحدّد خيارات الاستضافة المتاحة لكم.'} },
  { topic:'budget', asked:176, decree:'AI-2025-009',
    q:{en:'Who pays for compute and software licences — the central programme or our own budget?',
       ar:'من يتحمّل تكلفة الحوسبة والتراخيص — البرنامج المركزي أم ميزانيتنا الخاصة؟'},
    a:{en:'Central compute (GPU capacity on the Government AI Cloud) is funded from the programme allocation. Platform and model licences are procured through central framework agreements so all entities benefit from government pricing rather than negotiating individually. Your entity budget covers entity-specific application development, integration, and change management. Procuring licences or compute outside these vehicles is discouraged and needs justification.',
       ar:'تُموّل الحوسبة المركزية (سعة GPU على السحابة الحكومية) من مخصّص البرنامج. وتُشترى تراخيص المنصّات والنماذج عبر اتفاقيات إطارية مركزية كي تستفيد جميع الجهات من الأسعار الحكومية بدلًا من التفاوض الفردي. وتغطّي ميزانية جهتكم تطوير التطبيقات الخاصة بكم والتكامل وإدارة التغيير. ولا يُحبّذ شراء التراخيص أو الحوسبة خارج هذه الآليات ويحتاج إلى مبرّر.'} },
  { topic:'governance', asked:154, decree:'AI-2026-002',
    q:{en:'Can we deploy autonomous “agentic” systems that take actions, not just chatbots?',
       ar:'هل يمكننا نشر أنظمة «وكيلة» مستقلة تتّخذ إجراءات، وليست مجرّد روبوتات محادثة؟'},
    a:{en:'Yes, within guardrails. Agentic systems are permitted under a tiered model: low-risk actions (drafting, retrieval, internal routing) need standard approval; irreversible or citizen-facing actions require human-in-the-loop confirmation, scoped permissions, and full audit logging. High-autonomy use cases go through an elevated review. Every agent must have a named accountable owner, a defined action boundary, and a kill-switch. These controls are set out in the Agentic AI Governance decree.',
       ar:'نعم، ضمن ضوابط. يُسمح بالأنظمة الوكيلة وفق نموذج متدرّج: الإجراءات منخفضة المخاطر (الصياغة والاسترجاع والتوجيه الداخلي) تحتاج موافقة قياسية؛ أمّا الإجراءات غير القابلة للتراجع أو الموجَّهة للمتعاملين فتتطلّب تأكيدًا بشريًا ضمن الحلقة، وصلاحيات محدّدة النطاق، وتسجيلًا كاملًا للعمليات. وتمرّ حالات الاستقلالية العالية بمراجعة مشدّدة. ويجب أن يكون لكل وكيل مالك مسؤول مُسمّى، وحدود إجراء واضحة، ومفتاح إيقاف. وهذه الضوابط منصوص عليها في قرار حوكمة الذكاء الاصطناعي الوكيل.'} },
  { topic:'governance', asked:138, decree:'AI-2025-018',
    q:{en:'What approvals do we need before deploying an AI system to production?',
       ar:'ما الموافقات المطلوبة قبل نشر نظام ذكاء اصطناعي في بيئة الإنتاج؟'},
    a:{en:'Three sign-offs, all handled through this portal: (1) a data-classification sign-off, (2) a security review, and (3) a model risk assessment covering bias, accuracy, and fallback behaviour. Standard, low-risk pilots are fast-tracked and typically cleared within days; high-risk or citizen-facing systems take a fuller review. You receive a single go-live approval reference once all three are complete.',
       ar:'ثلاث موافقات، تُدار جميعها عبر هذه البوابة: (1) اعتماد تصنيف البيانات، (2) المراجعة الأمنية، (3) تقييم مخاطر النموذج الذي يشمل التحيّز والدقّة وسلوك الحلول الاحتياطية. وتُعالَج التجارب القياسية منخفضة المخاطر بمسار سريع وتُعتمد عادةً خلال أيام؛ أمّا الأنظمة عالية المخاطر أو الموجَّهة للمتعاملين فتخضع لمراجعة أوفى. وتحصلون على مرجع اعتماد إطلاق واحد بعد اكتمال الثلاثة.'} },
  { topic:'workforce', asked:121, decree:'AI-2025-011',
    q:{en:'Do we need to hire AI specialists ourselves, or is there shared capacity we can draw on?',
       ar:'هل نحتاج إلى توظيف اختصاصيي ذكاء اصطناعي بأنفسنا، أم توجد قدرات مشتركة يمكننا الاستعانة بها؟'},
    a:{en:'Both options exist, and most entities use a mix. A central enablement team and a shared specialist pool support complex builds, architecture reviews, and onboarding. Each entity designates an AI Lead as the single point of contact, and staff get access to structured training and certification tracks. You are not expected to build a large in-house AI team from scratch to begin — start with the shared capacity and grow your own capability over time.',
       ar:'كلا الخيارين متاح، ويستخدم معظم الجهات مزيجًا منهما. يدعم فريق تمكين مركزي وفريق اختصاصيين مشترك عمليات البناء المعقّدة ومراجعات البنية والانضمام. وتعيّن كل جهة «قائدًا للذكاء الاصطناعي» كنقطة تواصل واحدة، ويحصل الموظفون على مسارات تدريب واعتماد منظّمة. ولا يُتوقّع منكم بناء فريق ذكاء اصطناعي داخلي كبير من الصفر للبدء — ابدؤوا بالقدرة المشتركة ثم طوّروا قدراتكم تدريجيًا.'} },
];

const KB_EXTRA = [
  { topic:'infra', q:{en:'How do we request a GPU quota increase for a growing workload?',ar:'كيف نطلب زيادة حصّة GPU لحمل عمل متنامٍ؟'},
    a:{en:'Raise a request through the Request Desk with your projected utilisation and model size. Increases for registered, compliant workloads are typically granted within one review cycle; bursts for short pilots can be approved temporarily.',ar:'ارفعوا طلبًا عبر مكتب الطلبات مرفقًا بالاستخدام المتوقّع وحجم النموذج. وتُمنح الزيادات للأحمال المسجّلة والمتوافقة عادةً خلال دورة مراجعة واحدة؛ ويمكن اعتماد دفعات مؤقتة للتجارب القصيرة.'} },
  { topic:'vendors', q:{en:'A vendor we like is not on the approved list. Can we request that it be added?',ar:'مورد نفضّله غير مدرج في القائمة المعتمدة. هل يمكننا طلب إضافته؟'},
    a:{en:'Yes. Submit a vendor-onboarding request with the use case and data classification. The vendor is assessed for sovereignty, security posture, and contractual terms. Until approved, it may not handle government data.',ar:'نعم. قدّموا طلب اعتماد مورد مع حالة الاستخدام وتصنيف البيانات. ويُقيَّم المورد من حيث السيادة والوضع الأمني والشروط التعاقدية. وإلى حين اعتماده لا يجوز له معالجة بيانات حكومية.'} },

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = name => name.split(' ').filter(w=>/[A-Za-z؀-ۿ]/.test(w[0])).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const statusClass = s => ({ineffect:'ok',approved:'ok',answered:'ok',sovereign:'ok',draft:'warn',conditional:'warn',underreview:'info',submitted:'muted',superseded:'muted'}[s]||'muted');
function fmtDate(d){
  const [y,m,da]=d.split('-').map(Number);
  const en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ar=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return isAr()?`${da} ${ar[m-1]} ${y}`:`${da} ${en[m-1]} ${y}`;
}

function renderView(){
  const v = state.view;
  const html = v==='home'?viewHome()
    :v==='framework'?viewFramework():v==='guides'?viewGuides():v==='faqs'?viewFaqs()
    :v==='search'?viewSearch():'';
  const tab = TABS.find(x=>x.id===v);
  const crumbs = v!=='home' ? `<div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a data-action="nav" data-arg="home">${esc(t('home'))}</a><span class="sep">›</span><b>${esc(tab?t(tab.label):t('search'))}</b></nav></div>` : '';
  const pagefoot = (v==='framework'||v==='guides'||v==='faqs') ? `<div class="wrap"><div class="pgfoot">
      <div class="pf-q"><b>${esc(L({en:'Was this page helpful?',ar:'هل كانت هذه الصفحة مفيدة؟'}))}</b>
        <span><button class="btn ghost sm" data-action="helpful">${ic('thumb')} ${esc(t('yes'))}</button>
        <button class="btn ghost sm" data-action="helpful">${esc(t('no'))}</button></span></div>
      <div class="pf-upd">${ic('cal')} ${esc(L({en:'Last updated: July 2026',ar:'آخر تحديث: يوليو 2026'}))}</div>
    </div></div>` : '';
  $('#main').innerHTML = crumbs + html + pagefoot;
  $('#main').scrollIntoView({block:'start'});
  window.scrollTo({top:0});
  if(v==='search'){ const sb=$('#searchBox'); if(sb){ sb.focus(); const n=sb.value.length; try{sb.setSelectionRange(n,n);}catch(_){} } }
  if(v==='home') animateCounters();
}
function animateCounters(){
  document.querySelectorAll('.count').forEach(el=>{
    const to=+el.dataset.to, suf=el.dataset.suffix||'', dur=900, t0=performance.now();
    (function step(t){ const pr=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-pr,3)))+suf; if(pr<1) requestAnimationFrame(step); })(t0);
  });
}

/* ---- SEARCH ---- */
function searchResultsHTML(q){
  const term=(q||'').trim().toLowerCase();
  if(!term) return `<div class="card" style="text-align:center;color:var(--muted);padding:34px">${ic('search')}<div style="margin-top:10px">${esc(L({en:'Start typing to search the framework, guides and FAQs.',ar:'ابدأ الكتابة للبحث في نظام العمل والأدلة والأسئلة الشائعة.'}))}</div></div>`;
  const has=(...vals)=>vals.some(v=>v&&String(v).toLowerCase().includes(term));
  const faqs=allQA().filter(x=>has(x.q.en,x.q.ar,x.a.en,x.a.ar,topicName(x.topic)));
  const fw=[
    ...FW.concepts.map(c=>({sec:'fw-concepts',t:c.t,d:c.d})),
    ...FW.criteria.map(c=>({sec:'fw-criteria',t:c.t,d:{en:c.items.map(x=>x.en).join(' · '),ar:c.items.map(x=>x.ar).join(' · ')}})),
    ...FW.phases.map(p=>({sec:'fw-timeline',t:p.ph,d:{en:p.items.map(x=>x.en).join(' '),ar:p.items.map(x=>x.ar).join(' ')}})),
  ].filter(x=>has(x.t.en,x.t.ar,x.d.en,x.d.ar));
  const gds=GUIDES.filter(g=>has(g.title.en,g.title.ar,g.desc.en,g.desc.ar,...g.toc.map(x=>x.en),...g.toc.map(x=>x.ar)));
  const total=faqs.length+fw.length+gds.length;
  if(!total) return `<div class="card" style="text-align:center;color:var(--muted);padding:34px">${ic('search')}<div style="margin-top:10px">${esc(L({en:'No results for',ar:'لا نتائج لـ'}))} “${esc(q)}”.</div></div>`;
  const sec=(title,count,inner)=> count?`<div class="h-lead" style="margin:18px 0 12px"><h3 style="font-size:1.1rem">${esc(title)} <span style="color:var(--muted);font-weight:600">(${count})</span></h3></div>${inner}`:'';
  const fwHtml=fw.map(x=>`<div class="rowcard" data-action="goFw" data-arg="${x.sec}" style="margin-bottom:11px">
      <div class="lead">${ic('flow')}</div>
      <div class="mid"><div class="ttl">${esc(L(x.t))}</div><div class="meta"><span>${esc(L({en:'The Framework',ar:'نظام العمل'}))}</span></div></div>
      <div class="end">${ic('chev','chev')}</div></div>`).join('');
  const gHtml=gds.map(g=>`<div class="rowcard" data-action="nav" data-arg="guides" style="margin-bottom:11px">
      <div class="lead">${ic('book')}</div>
      <div class="mid"><div class="ttl">${esc(L(g.title))}</div><div class="meta"><span>${g.pages} ${esc(L({en:'pages',ar:'صفحة'}))} · PDF</span></div></div>
      <div class="end">${ic('chev','chev')}</div></div>`).join('');
  const fHtml=faqs.map(x=>accordion(x,0)).join('');
  return `<div style="font-size:.85rem;color:var(--muted);margin-bottom:6px">${total} ${esc(L({en:'results',ar:'نتيجة'}))}</div>`
    + sec(L({en:'The framework',ar:'نظام العمل'}),fw.length,fwHtml)
    + sec(L({en:'Guides',ar:'الأدلة'}),gds.length,gHtml)
    + sec(L({en:'FAQs',ar:'الأسئلة الشائعة'}),faqs.length,fHtml);
}

    <div class="eyebrow">${esc(t('search'))}</div>
    <div class="h-lead"><div><h2>${esc(L({en:'Search',ar:'بحث'}))}</h2>
      <p>${esc(L({en:'Search across decrees, questions, and approved vendors.',ar:'ابحث في القرارات والأسئلة والموردين المعتمدين.'}))}</p></div></div>

function openModal(html){ $('#modalHost').innerHTML = `<div class="modal wide">${html}</div>`; $('#overlay').classList.add('show'); }
function closeModal(){ $('#overlay').classList.remove('show'); $('#modalHost').innerHTML=''; }

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function showToast(msg){
  const el=$('#toast'); el.innerHTML=`${ic('checkc')}<span>${esc(msg)}</span>`; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ============================================================
   ACTIONS
============================================================ */
function applyLang(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isAr()?'rtl':'ltr';
}
function render(){ renderHeader(); renderFooter(); renderView(); }

document.addEventListener('click', e=>{
  const acc = e.target.closest('[data-action="acc"]');
  if(acc){ acc.closest('.acc').classList.toggle('open'); return; }
  const ct = e.target.closest('[data-action="cardToggle"]');
  if(ct){ ct.classList.toggle('open'); return; }
  const el = e.target.closest('[data-action]');
  // close menu when clicking outside
  if(state.menuOpen && !e.target.closest('.chip')){ state.menuOpen=false; renderHeader(); }
  if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  switch(a){
    case 'lang': state.lang=arg; applyLang(); state.menuOpen=false; if(state.signedIn) render(); else renderSignin(); break;
    case 'nav': state.view=arg; state.menuOpen=false; renderHeader(); renderView(); break;
    case 'toggleMenu': state.menuOpen=!state.menuOpen; renderHeader(); break;
    case 'signin': doSignin(); break;
    case 'signout': state.signedIn=false; state.menuOpen=false; $('#app').classList.remove('show'); $('#signin').classList.remove('hide'); renderSignin(); break;
    case 'filterMA': state.maTopic=arg; renderView(); break;
    case 'helpful': showToast(L({en:'Thanks for your feedback',ar:'شكرًا لملاحظتك'})); break;
    case 'closeModal': closeModal(); break;
    case 'toast': showToast(arg); break;
    case 'goSearch': state.view='search'; renderHeader(); renderView(); break;
    case 'fontSize': { state.fs = arg==='0'?0:Math.max(-1,Math.min(2,(state.fs||0)+(arg==='+'?1:-1))); document.documentElement.style.fontSize = (16*(1+state.fs*0.07))+'px'; break; }
    case 'selTrack': state.homeTrack=arg; renderView(); break;
    case 'selPhase': state.homePhase=arg; renderView(); break;
    case 'goFw': state.view='framework'; renderHeader(); renderView(); setTimeout(()=>{const el=document.getElementById(arg); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},60); break;
    case 'scrollTo': { const el=document.getElementById(arg); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); break; }
  }
});
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

window.addEventListener('scroll', ()=>{ const b=$('#totop'); if(b) b.classList.toggle('show', window.scrollY>560); }, {passive:true});
document.addEventListener('DOMContentLoaded', ()=>{});
$('#totop').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

document.addEventListener('input', e=>{
  if(e.target && e.target.id==='searchBox'){
    state.q = e.target.value;
    const r = $('#searchResults'); if(r) r.innerHTML = searchResultsHTML(state.q);
  }
  if(e.target && e.target.id==='heroSearch'){
    state.q = e.target.value;
    const term = state.q.trim();
    const hr = $('#heroResults'), hb = $('#homeBody');
    if(hr) hr.innerHTML = term ? searchResultsHTML(state.q) : '';
    if(hb) hb.style.display = term ? 'none' : '';
  }
});

function doSignin(){
  const ei = +($('#si-entity')?.value||0);
  state.entity = ENTITIES[ei].en; state.entityAr = ENTITIES[ei].ar;
  state.admin = ($('#si-role')?.value==='admin');
  state.signedIn = true; state.view='home';
  $('#signin').classList.add('hide'); $('#app').classList.add('show');
  applyLang(); render();
}
document.querySelector("link[rel='icon'],link[rel=icon]")?.setAttribute('href', FAVICON_URI);
applyLang();
renderSignin();
